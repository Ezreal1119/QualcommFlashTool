[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qualcomm-flash-tool"
version = "2.0.0"
description = "A macOS desktop workspace for controlled Qualcomm EDL flashing"
requires-python = ">=3.11,<3.12"
dependencies = ["PySide6==6.8.3", "pyusb==1.3.1", "pyserial==3.5", "colorama==0.4.6", "pycryptodomex==3.23.0", "requests==2.32.5", "lxml==6.0.2", "defusedxml==0.7.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pyinstaller==6.16.0", "Pillow==11.3.0", "ruff==0.14.0"]

[project.scripts]
qualcomm-flash-tool = "qft.app:main"

[tool.setuptools.packages.find]
include = ["qft*"]

[tool.setuptools.package-data]
qft = ["ui/*.qml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
